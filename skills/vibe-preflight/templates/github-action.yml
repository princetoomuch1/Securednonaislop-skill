name: vibe-preflight

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (for build scan)
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build (so the shipped bundle is scanned for secrets)
        if: hashFiles('package.json') != ''
        continue-on-error: true
        run: |
          npm ci --ignore-scripts || npm install --ignore-scripts
          npm run build --if-present

      - name: Run vibe-preflight
        id: scan
        uses: princetoomuch1/Securednonaislop-skill@v1
        with:
          path: .
          jurisdiction: eu,uk,us
          fail-on: P0

      - name: Upload SARIF to GitHub code scanning
        if: always() && hashFiles('.preflight/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .preflight/results.sarif
          category: vibe-preflight

      - name: Comment summary on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('.preflight/report.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.preflight/report.md', 'utf8').slice(0, 60000);
            const marker = '<!-- vibe-preflight-comment -->';
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const old = comments.find(c => c.body.includes(marker));
            const text = marker + '\n' + body;
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body: text });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: text });
